name: cool quality checks

on:
  push:
    branches: [nightly]
  pull_request:
    branches: [nightly]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup da node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install lint tools
        run: npm install --no-save eslint @eslint/js globals stylelint stylelint-config-standard htmlhint

      - name: ESLint
        run: npx eslint --max-warnings 0

      - name: stylelint
        run: npx stylelint "assets/scripts/styles/*.css" --allow-empty-input

      - name: HTMLHint
        run: |
          npx htmlhint \
            "index.html" \
            "404.html" \
            "assets/frontend/*.html" \
            "blog/*.html" \
            "blog/posts/*.html" \
            "boring/*.html" \
            --config .htmlhintrc

  smoke-test:
    name: smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install test tools
        run: npm install --no-save @playwright/test

      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: run smoke tests
        run: npx playwright test tests/smoke.spec.js --project=chromium
        env:
          BASE_URL: https://nightly.authsrng.xyz

  all-checks-passed:
    name: all checks passed!
    runs-on: ubuntu-latest
    needs: [lint, smoke-test]
    if: always()
    steps:
      - name: gate
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.smoke-test.result }}" != "success" ]]; then
            echo "one or more checks failed"
            exit 1
          fi
