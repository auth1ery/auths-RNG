name: nerimity notify

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, closed, synchronize, edited]
  issues:
    types: [opened, closed, reopened, edited]
  issue_comment:
    types: [created]
  release:
    types: [published]
  fork:
  watch:
    types: [started]
  workflow_run:
    workflows: ['*']
    types: [completed]
  deployment_status:

jobs:
  nerimity:
    runs-on: ubuntu-latest
    steps:
      - name: send push to nerimity
        if: github.event_name == 'push'
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"push: auths-RNG@${{ github.ref_name }}\ncommit: ${{ github.sha }}\nurl: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}\nauthor: ${{ github.actor }}\nmessage: ${{ github.event.head_commit.message }}\"}" \
            ${{ secrets.NERI_WEBHOOK }}

      - name: send PR event to nerimity
        if: github.event_name == 'pull_request'
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"pr ${{ github.event.action }}: #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}\nurl: ${{ github.event.pull_request.html_url }}\nauthor: ${{ github.actor }}\"}" \
            ${{ secrets.NERI_WEBHOOK }}

      - name: send issue event to nerimity
        if: github.event_name == 'issues'
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"issue ${{ github.event.action }}: #${{ github.event.issue.number }} ${{ github.event.issue.title }}\nurl: ${{ github.event.issue.html_url }}\nauthor: ${{ github.actor }}\"}" \
            ${{ secrets.NERI_WEBHOOK }}

      - name: send issue comment to nerimity
        if: github.event_name == 'issue_comment'
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"comment on #${{ github.event.issue.number }} ${{ github.event.issue.title }}\nurl: ${{ github.event.comment.html_url }}\nauthor: ${{ github.actor }}\"}" \
            ${{ secrets.NERI_WEBHOOK }}

      - name: send release to nerimity
        if: github.event_name == 'release'
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"release published: ${{ github.event.release.tag_name }}\nurl: ${{ github.event.release.html_url }}\"}" \
            ${{ secrets.NERI_WEBHOOK }}
      - name: send fork to nerimity
        if: github.event_name == 'fork'
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"repo forked by ${{ github.actor }}\nurl: ${{ github.event.forkee.html_url }}\"}" \
            ${{ secrets.NERI_WEBHOOK }}

      - name: send star to nerimity
        if: github.event_name == 'watch'
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"star added by ${{ github.actor }}\nrepo: ${{ github.repository }}\"}" \
            ${{ secrets.NERI_WEBHOOK }}

      - name: send workflow run result to nerimity
        if: github.event_name == 'workflow_run'
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"workflow '${{ github.event.workflow_run.name }}' ${{ github.event.workflow_run.conclusion }}\nbranch: ${{ github.event.workflow_run.head_branch }}\nurl: ${{ github.event.workflow_run.html_url }}\"}" \
            ${{ secrets.NERI_WEBHOOK }}

      - name: send deployment status to nerimity
        if: github.event_name == 'deployment_status'
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"deployment ${{ github.event.deployment_status.state }}: ${{ github.event.deployment.environment }}\nurl: ${{ github.event.deployment_status.target_url }}\"}" \
            ${{ secrets.NERI_WEBHOOK }}
